name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      # 무거운 런타임 의존성(chromadb/torch) 없이 순수 로직 테스트만 실행
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -v
        env:
          ANTHROPIC_API_KEY: ""  # 단위 테스트는 API 호출 없음

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 로컬 개발 런타임과 동일 major — package-lock.json 이 npm 11(node 24)로 생성됨
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci 가 아니라 npm install 을 쓴다: lockfile 이 Windows 에서 생성되는데,
      # npm 은 그 환경에서 wasm32-wasi optional 패키지(@tailwindcss/oxide, rolldown)의
      # 하위 의존성(@emnapi/*)을 resolved/integrity 없이 자리표시자로만 기록한다.
      # 그러면 리눅스 npm ci 가 "Missing: @emnapi/core from lock file" 로 거부한다.
      # 트레이드오프: CI 는 pinned 트리가 아니라 range 재해석 결과를 검증한다.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
