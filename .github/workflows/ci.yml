name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      # 무거운 런타임 의존성(chromadb/torch) 없이 순수 로직 테스트만 실행
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -v
        env:
          ANTHROPIC_API_KEY: ""  # 단위 테스트는 API 호출 없음

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 로컬 개발 런타임과 동일 major — package-lock.json 이 npm 11(node 24)로 생성됨
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
